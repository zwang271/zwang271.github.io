computer_science:
  - id: mltl-ecosystem-isola-2026
    year: "2026"
    title: An Integrated Ecosystem for Mission-time LTL Specification Elicitation and Validation
    area: Formal methods
    authors:
      - name: Zili Wang
        self: true
      - name: Alec Rosentrater
      - name: Alexis Aurandt
      - name: Christopher Johannsen
      - name: Kristin Yvonne Rozier
    venue: Accepted to the International Symposium on Leveraging Applications of Formal Methods, Verification and Validation (ISoLA), 2026.
    doi_status: DOI forthcoming
    abstract: >-
      This work presents an integrated ecosystem for eliciting and validating Mission-time Linear Temporal Logic specifications. It brings complementary tools and workflows together so that users can move from informal requirements to formal specifications and check that those specifications capture the intended behavior.
    bibtex: |-
      @inproceedings{WangEtAl2026MLTLEcosystem,
        author    = {Zili Wang and Alec Rosentrater and Alexis Aurandt and Christopher Johannsen and Kristin Yvonne Rozier},
        title     = {An Integrated Ecosystem for Mission-time {LTL} Specification Elicitation and Validation},
        booktitle = {International Symposium on Leveraging Applications of Formal Methods, Verification and Validation},
        year      = {2026},
        note      = {Accepted}
      }
    resources:
      - label: MLTL Ecosystem
        url: https://mltl.temporallogic.org/

  - id: west-scp-2026
    year: "2026"
    title: "WEST: Interactive Validation of Mission-time Linear Temporal Logic (MLTL)"
    area: Formal methods
    authors:
      - name: Zili Wang
        self: true
      - name: Laura P. Gamboa Guzman
      - name: Kristin Y. Rozier
    venue: Science of Computer Programming, vol. 248, article 103365, 2026.
    doi: https://doi.org/10.1016/j.scico.2025.103365
    abstract: >-
      WEST is an interactive tool for validating MLTL specifications by visualizing the traces that satisfy a formula. The paper presents its command-line and graphical interfaces, five independent methods used to validate the implementation, and scalability results over several suites of randomly generated formulas.
    bibtex: |-
      @article{WangGamboaGuzmanRozier2026WEST,
        author  = {Zili Wang and Laura P. Gamboa Guzman and Kristin Y. Rozier},
        title   = {{WEST}: Interactive Validation of Mission-time Linear Temporal Logic ({MLTL})},
        journal = {Science of Computer Programming},
        volume  = {248},
        pages   = {103365},
        year    = {2026},
        doi     = {10.1016/j.scico.2025.103365}
      }
    resources:
      - label: Zenodo artifact
        url: https://zenodo.org/records/14649154

  - id: formula-progression-cicm-2025
    year: "2025"
    title: Formalizing MLTL Formula Progression in Isabelle/HOL
    area: Formal methods
    authors:
      - name: Katherine Kosaian
      - name: Zili Wang
        self: true
      - name: Elizabeth Sloan
      - name: Kristin Yvonne Rozier
    venue: In Proceedings of the Conference on Intelligent Computer Mathematics (CICM), pp. 371–391, 2025.
    doi: https://doi.org/10.1007/978-3-032-07021-0_21
    abstract: >-
      This work formalizes MLTL syntax, semantics, and formula progression in Isabelle/HOL. It proves the progression algorithm correct, resolves errors and missing assumptions in prior presentations, and exports executable code that can support trustworthy formula evaluation and benchmark generation.
    bibtex: |-
      @inproceedings{KosaianEtAl2025FormulaProgression,
        author    = {Katherine Kosaian and Zili Wang and Elizabeth Sloan and Kristin Yvonne Rozier},
        title     = {Formalizing {MLTL} Formula Progression in {Isabelle/HOL}},
        booktitle = {Intelligent Computer Mathematics},
        series    = {Lecture Notes in Computer Science},
        volume    = {16136},
        pages     = {371--391},
        year      = {2025},
        doi       = {10.1007/978-3-032-07021-0_21}
      }
    resources:
      - label: AFP formalization
        url: https://isa-afp.org/entries/Mission_Time_LTL_Formula_Progression.html

  - id: language-partitioning-nfm-2025
    year: "2025"
    title: Language Partitioning for Mission-time Linear Temporal Logic
    area: Formal methods
    authors:
      - name: Alec Rosentrater
        equal: true
      - name: Zili Wang
        self: true
        equal: true
      - name: Katherine Kosaian
      - name: Kristin Yvonne Rozier
    venue: In Proceedings of the NASA Formal Methods Symposium (NFM), pp. 313–332, 2025.
    doi: https://doi.org/10.1007/978-3-031-93706-4_18
    abstract: >-
      This paper gives an algorithm that partitions the language of an MLTL formula into disjoint sublanguages represented by related formulas. The algorithm and its correctness proof are mechanized in Isabelle/HOL, exported to executable code, and evaluated experimentally.
    bibtex: |-
      @inproceedings{RosentraterEtAl2025LanguagePartitioning,
        author    = {Alec Rosentrater and Zili Wang and Katherine Kosaian and Kristin Yvonne Rozier},
        title     = {Language Partitioning for Mission-time Linear Temporal Logic},
        booktitle = {NASA Formal Methods},
        series    = {Lecture Notes in Computer Science},
        volume    = {15682},
        pages     = {313--332},
        year      = {2025},
        doi       = {10.1007/978-3-031-93706-4_18}
      }
    resources:
      - label: AFP formalization
        url: https://isa-afp.org/entries/Mission_Time_LTL_Language_Partition.html

  - id: verified-regex-tacas-2025
    year: "2025"
    title: Formally Verifying a Transformation from MLTL Formulas to Regular Expressions
    area: Formal methods
    authors:
      - name: Zili Wang
        self: true
      - name: Katherine Kosaian
      - name: Kristin Yvonne Rozier
    venue: In Proceedings of the International Conference on Tools and Algorithms for the Construction and Analysis of Systems (TACAS), pp. 254–275, 2025.
    doi: https://doi.org/10.1007/978-3-031-90643-5_13
    abstract: >-
      This work mechanizes the WEST transformation from MLTL formulas to trace regular expressions and proves semantic equivalence in Isabelle/HOL. It also develops verified support for restricted regular-expression equivalence and uses exported code to validate the existing WEST implementation.
    bibtex: |-
      @inproceedings{WangKosaianRozier2025VerifiedRegex,
        author    = {Zili Wang and Katherine Kosaian and Kristin Yvonne Rozier},
        title     = {Formally Verifying a Transformation from {MLTL} Formulas to Regular Expressions},
        booktitle = {Tools and Algorithms for the Construction and Analysis of Systems},
        series    = {Lecture Notes in Computer Science},
        volume    = {15696},
        pages     = {254--275},
        year      = {2025},
        doi       = {10.1007/978-3-031-90643-5_13}
      }
    resources:
      - label: AFP formalization
        url: https://isa-afp.org/entries/Mission_Time_LTL_to_Regular_Expression.html

  - id: responsible-ai-atm-2025
    year: "2025"
    title: "Responsible AI for Air Traffic Management: Application to Runway Configuration Assistance Tool"
    area: Aerospace & AI
    authors:
      - name: Milad Memarzadeh
      - name: Zili Wang
        self: true
      - name: Farzan Masrour Shalmani
      - name: Pouria Razzaghi
      - name: Krishna M. Kalyanam
    venue: Aerospace, vol. 12, no. 10, article 872, 2025.
    doi: https://doi.org/10.3390/aerospace12100872
    abstract: >-
      This paper studies responsible-AI considerations for air traffic management and applies a practical subset of them to a runway-configuration assistance tool. It examines how an AI decision-support system can be assessed and communicated in a safety-conscious operational setting.
    bibtex: |-

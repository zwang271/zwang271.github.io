mathematics:
  - id: permutation-orbits-ii-2023
    year: "2023"
    title: Finite Permutation Groups With Few Orbits Under the Action on the Power Set, II
    area: Group theory
    authors:
      - name: Michael Gintz
      - name: Matthew Kortje
      - name: Megan Laurance
      - name: Zili Wang
        self: true
      - name: Yong Yang
    venue: Publicationes Mathematicae Debrecen, vol. 102, pp. 237–254, 2023.
    doi: https://doi.org/10.5486/PMD.2023.9392
    abstract: >-
      This paper continues the classification of permutation groups by the number of orbits induced on a power set. It improves earlier theory and GAP algorithms to classify groups with n + r set-orbits for the previously unresolved range 16 through 33.
    bibtex: |-
      @article{GintzEtAl2023PermutationOrbitsII,
        author  = {Michael Gintz and Matthew Kortje and Megan Laurance and Zili Wang and Yong Yang},
        title   = {Finite Permutation Groups With Few Orbits Under the Action on the Power Set, {II}},
        journal = {Publicationes Mathematicae Debrecen},
        volume  = {102},
        pages   = {237--254},
        year    = {2023},
        doi     = {10.5486/PMD.2023.9392}
      }

  - id: simple-groups-codegrees-2022
    year: "2022"
    title: On the Characterization of Some Non-abelian Simple Groups with Few Codegrees
    area: Group theory
    authors:
      - name: Michael Gintz
      - name: Matthew Kortje
      - name: Megan Laurance
      - name: Zili Wang
        self: true
      - name: Yong Yang
    venue: Communications in Algebra, vol. 50, pp. 3932–3939, 2022.
    doi: https://doi.org/10.1080/00927872.2022.2049807
    abstract: >-
      The paper studies character codegrees as invariants of finite groups. It proves that the codegree sets of selected non-abelian simple groups, including PSL(3,3), determine those groups up to isomorphism.
    bibtex: |-
      @article{GintzEtAl2022SimpleGroupsCodegrees,
        author  = {Michael Gintz and Matthew Kortje and Megan Laurance and Zili Wang and Yong Yang},
        title   = {On the Characterization of Some Non-abelian Simple Groups with Few Codegrees},
        journal = {Communications in Algebra},
        volume  = {50},
        pages   = {3932--3939},
        year    = {2022},
        doi     = {10.1080/00927872.2022.2049807}
      }

  - id: set-orbits-group-order-2022
    year: "2022"
    title: The Number of Set Orbits of Permutation Groups and the Group Order
    area: Group theory
    authors:
      - name: Michael Gintz
      - name: Thomas Keller
      - name: Matthew Kortje
      - name: Megan Laurance
      - name: Zili Wang
        self: true
      - name: Yong Yang
    venue: Bulletin of the Australian Mathematical Society, vol. 106, pp. 89–101, 2022.
    doi: https://doi.org/10.1017/S0004972721001064
    abstract: >-
      A permutation group acting on a finite set also acts on its power set, producing a number of set orbits that is useful in bounding conjugacy classes. This paper determines the optimal ratio between the logarithms of the number of set orbits and the group order when large alternating composition factors are excluded.
    bibtex: |-
      @article{GintzEtAl2022SetOrbitsGroupOrder,
        author  = {Michael Gintz and Thomas Keller and Matthew Kortje and Megan Laurance and Zili Wang and Yong Yang},
        title   = {The Number of Set Orbits of Permutation Groups and the Group Order},
        journal = {Bulletin of the Australian Mathematical Society},
        volume  = {106},
        pages   = {89--101},
        year    = {2022},
        doi     = {10.1017/S0004972721001064}
      }

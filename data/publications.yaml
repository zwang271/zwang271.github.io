      }

  - id: basic-syntax-cogsci-2024
    year: "2024"
    title: "Basic Syntax from Speech: Spontaneous Concatenation in Unsupervised Deep Neural Networks"
    area: Machine learning
    authors:
      - name: Gašper Beguš
      - name: Thomas Lu
      - name: Zili Wang
        self: true
    venue: In Proceedings of the Annual Meeting of the Cognitive Science Society (CogSci), 2024.
    doi: https://doi.org/10.48550/arXiv.2305.01626
    doi_label: Preprint DOI
    abstract: >-
      Convolutional neural networks trained only on recordings of individual words spontaneously generate outputs containing two or three concatenated words. The study reproduces this behavior across models and datasets, finds novel word combinations, and discusses its implications for compositionality and models of syntax emerging directly from speech.
    bibtex: |-
      @inproceedings{BegusLuWang2024BasicSyntax,
        author    = {Gašper Beguš and Thomas Lu and Zili Wang},
        title     = {Basic Syntax from Speech: Spontaneous Concatenation in Unsupervised Deep Neural Networks},
        booktitle = {Proceedings of the 46th Annual Meeting of the Cognitive Science Society},
        year      = {2024},
        url       = {https://escholarship.org/uc/item/1ks8q4q9}
      }
    resources:
      - label: CogSci paper
        url: https://escholarship.org/uc/item/1ks8q4q9

  - id: treevada-icse-2024
    year: "2024"
    title: Fast Deterministic Black-box Context-free Grammar Inference
    area: Software engineering
    authors:
      - name: Mohammad Rifat Arefin
      - name: Suraj Shetiya
      - name: Zili Wang
        self: true
      - name: Christoph Csallner
    venue: In Proceedings of the IEEE/ACM 46th International Conference on Software Engineering (ICSE), article 117, pp. 1–12, 2024.
    doi: https://doi.org/10.1145/3597503.3639214
    abstract: >-
      TreeVada makes black-box context-free grammar inference deterministic by pre-structuring sample programs according to common nesting rules and recursively applying learned rules. In experiments it runs faster and infers higher-quality grammars than the prior nondeterministic Arvada approach.
    bibtex: |-
      @inproceedings{ArefinEtAl2024TreeVada,
        author    = {Mohammad Rifat Arefin and Suraj Shetiya and Zili Wang and Christoph Csallner},
        title     = {Fast Deterministic Black-box Context-free Grammar Inference},
        booktitle = {Proceedings of the 46th IEEE/ACM International Conference on Software Engineering},
        pages     = {117:1--117:12},
        year      = {2024},
        doi       = {10.1145/3597503.3639214}
      }
    resources:
      - label: Figshare artifact
        url: https://doi.org/10.6084/m9.figshare.23907738

  - id: mltl-validation-ifm-2023
    year: "2023"
    title: Mission-time LTL (MLTL) Formula Validation via Regular Expressions
    area: Formal methods
    authors:
      - name: Jenna Elwing
        equal: true
      - name: Laura Gamboa
      - name: Jeremy Sorkins
        equal: true
      - name: Chiara Travesset
        equal: true
      - name: Zili Wang
        self: true
        equal: true
      - name: Kristin Rozier
    venue: In Proceedings of the International Conference on Integrated Formal Methods (iFM), pp. 279–301, 2023.
    doi: https://doi.org/10.1007/978-3-031-47705-8_15
    abstract: >-
      This paper characterizes the computations satisfying an MLTL formula using trace regular expressions and proves the construction sound and complete. It introduces an automated validation algorithm, studies its complexity, and evaluates an open-source implementation with a generated test suite and graphical interface.
    bibtex: |-
